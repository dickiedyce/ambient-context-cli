[package]
name = "ambient-context"
version = "0.2.0"
description = "A CLI tool that keeps a written record of what you worked on."
authors = ["Cameron Smith"]
edition = "2021"

[[bin]]
name = "ambient-context"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
regex = "1"
dirs = "5"
libc = "0.2"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
