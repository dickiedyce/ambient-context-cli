name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: ambient-context-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: cli

      - name: Build AX helper
        run: swift build -c release
        working-directory: cli/src-ax

      - name: Package
        run: |
          mkdir -p dist
          cp cli/target/${{ matrix.target }}/release/ambient-context dist/
          cp cli/src-ax/.build/release/ambient-context-ax dist/
          cd dist
          tar czf ../${{ matrix.name }}.tar.gz *

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
          draft: true
